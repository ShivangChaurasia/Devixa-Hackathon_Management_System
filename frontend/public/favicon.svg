<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="512" height="512" rx="108" fill="url(#shine)" opacity="0.4"/>
  <g transform="translate(256,256)">
    <!-- Hexagonal code bracket motif -->
    <path d="M-60,-120 L-120,-40 L-120,40 L-60,120" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
    <path d="M60,-120 L120,-40 L120,40 L60,120" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
    <!-- Center spark/star -->
    <circle cx="0" cy="0" r="18" fill="white" opacity="0.9"/>
    <circle cx="0" cy="-55" r="8" fill="white" opacity="0.6"/>
    <circle cx="0" cy="55" r="8" fill="white" opacity="0.6"/>
  </g>
</svg>
